<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>설문지</title>
</head>
<body>

<h1>설문지</h1>
<p>소프트웨어 기술에 대한 의견을 듣습니다. 많은 참여 부탁드립니다.</p>

<form>
  <p>
    학년
    <input type="radio" name="grade" id="g1"><label for="g1">1학년</label>
    <input type="radio" name="grade" id="g2"><label for="g2">2학년</label>
    <input type="radio" name="grade" id="g3"><label for="g3">3학년</label>
    <input type="radio" name="grade" id="g4"><label for="g4">4학년</label>
  </p>

  <p>
    성별
    <input type="radio" name="gender" id="male"><label for="male">남</label>
    <input type="radio" name="gender" id="female"><label for="female">여</label>
  </p>

  <p>
    관심 분야
    <select>
      <option>모바일 소프트웨어</option>
      <option>웹 서비스</option>
      <option>빅데이터</option>
      <option>디지털 콘텐츠 및 가상 현실</option>
    </select>
  </p>

  <p>
    진로
    <input type="checkbox" id="dev"><label for="dev">개발</label>
    <input type="checkbox" id="plan"><label for="plan">기획</label>
    <input type="checkbox" id="sales"><label for="sales">영업</label>
    <input type="checkbox" id="startup"><label for="startup">창업</label>
  </p>

  <p>
    남기고 싶은 말<br>
    <textarea rows="4" cols="40" placeholder="글을 남겨주세요"></textarea>
  </p>

  <input type="submit" value="제출">
</form>

<footer>
  <p>Copyright 2017 by Kitae</p>
</footer>

</body>
</html>
