<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>To-Do List</title>
<style>
body {
font-family: sans-serif;
padding: 20px;
max-width: 500px;
margin: auto;
}
h1 { text-align: center; }
#todo-form {
display: flex;
gap: 10px;
margin-bottom: 20px;
}
#todo-form input[type="text"] {
flex: 1;
padding: 8px;
font-size: 16px;
}
#todo-form button {
padding: 8px 16px;
font-size: 16px;
cursor: pointer;
}
ul {
list-style: none;
padding: 0;
}
li {
display: flex;
justify-content: space-between;
align-items: center;
padding: 8px 0;
border-bottom: 1px solid #ccc;
}
li span {
flex: 1;
}
li.completed span {
text-decoration: line-through;
color: gray;
}
.action-buttons {
display: flex; gap: 5px;
}
.complete-btn, .delete-btn {
border: none;
padding: 4px 8px;
font-size: 14px;
cursor: pointer;
}
.complete-btn {
background-color: green;
color: white;
}
.delete-btn {
background-color: red;
color: white;
}
</style></head>
<body>
<h1>To-Do List</h1>
<!-- 입력 폼 영역 -->
<div id="todo-form">
<input type="text" id="todo-input" placeholder="할 일을 입력
하세요">
<button onclick="addTodo()">추가</button>
</div>
<ul id="todo-list"></ul> <!-- 이곳에 할 일 목록(li)을 추가 -->
<script>
// 새로운 할 일 추가 함수
function addTodo() {
const input = document.getElementById('todo-input');
const text = input.value.trim();
// 입력 값이 비어 있으면 경고 표시 후 종료
if (text === '') {
alert('할 일을 입력하세요!');
return;
}
// 새로운 li 요소 생성 & 할 일 텍스트를 담을 span 생성
const li = document.createElement('li');
const span = document.createElement('span');
span.textContent = text;
// 완료 버튼 생성
const completeBtn = document.createElement('button');
completeBtn.textContent = '완료';
completeBtn.className = 'complete-btn';
completeBtn.onclick = function () { // 완료 버튼 클릭 시
li.classList.toggle('completed'); // 'completed' class 토글
};
// 삭제 버튼 생성
const delBtn = document.createElement('button');
delBtn.textContent = '삭제';
delBtn.className = 'delete-btn';
delBtn.onclick = function () { // 삭제 버튼 클릭 시
li.remove(); // li 요소 제거
};
// 버튼들을 묶을 div 태그 생성
const buttonGroup = document.createElement('div');
buttonGroup.className = 'action-buttons';
buttonGroup.appendChild(completeBtn);
buttonGroup.appendChild(delBtn);
// li 태그에 텍스트와 버튼 그룹 추가
li.appendChild(span);
li.appendChild(buttonGroup);
// 최종적으로 ul(id=todo-list)에 li 추가
document.getElementById('todo-list').appendChild(li);
input.value = ''; // 입력창 초기화
}
</script>
</body></html>
