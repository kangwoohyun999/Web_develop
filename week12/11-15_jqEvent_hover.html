<!DOCTYPE html>
<html>
<head>
<title>Animate Basic</title>
<script src="http://code.jquery.com/jquery-3.7.1.js"></script>
<script>
$(document).ready(function () {
$('h1').hover(function () {
$(this).css({ // 색상 변경
background: 'red',
color: 'white'
});
}, function () { // 색상 제거
$(this).css({
background: '',
color: ''
});
});
});
</script>
</head>
