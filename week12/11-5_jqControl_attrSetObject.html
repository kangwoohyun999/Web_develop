<!DOCTYPE html>
<html>
<head>
<title>jQuery Basic</title>
<script src="http://code.jquery.com/jquery-3.7.1.js"></script>
<script>
$(document).ready(function () {
$('img').attr({ // 여러 개의 속성을 지정
alt: 'jQuery 라이브러리를 사용한 속성 지정',
src: 'https://loremflickr.com/100/100',
width: 100
});
});
</script>
</head>
<body>
<img><img><img>
</body>
</html>
