<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>3-1번: 은행 계좌 시뮬레이션</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            max-width: 500px;
        }
        h2 { color: #333; }
        .input-group { margin-bottom: 15px; }
        .radio-group { margin-bottom: 15px; }
        label { margin-right: 10px; }
        button {
            padding: 5px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        button:hover { background-color: #0056b3; }
        #messageBox {
            margin-top: 20px;
            padding: 10px;
            background-color: #f8f9fa;
            border-left: 5px solid #28a745;
            min-height: 50px;
            white-space: pre-line;
        }
    </style>
</head>
<body>

    <h2>은행 계좌 시뮬레이션</h2>
    
    <div class="radio-group">
        <input type="radio" id="checkBal" name="menu" value="check" checked onclick="toggleInput(false)">
        <label for="checkBal">잔액 확인</label>
        
        <input type="radio" id="deposit" name="menu" value="deposit" onclick="toggleInput(true)">
        <label for="deposit">저금</label>
        
        <input type="radio" id="withdraw" name="menu" value="withdraw" onclick="toggleInput(true)">
        <label for="withdraw">인출</label>
        
        <input type="radio" id="interest" name="menu" value="interest" onclick="toggleInput(false)">
        <label for="interest">이자 계산</label>
    </div>

    <div class="input-group" id="amountSection" style="display: none;">
        <label for="amount">금액 입력 (원):</label>
        <input type="text" id="amount" placeholder="금액을 입력하세요">
    </div>

    <button onclick="processTransaction()">실행</button>

    <h3>처리 결과</h3>
    <div id="messageBox">시스템이 준비되었습니다.</div>

    <script>
        // 초기 잔액 및 이율 설정
        let balance = 10000;
        const interestRate = 0.02; // 2%
        
        // 처리 메시지를 저장할 배열
        let logMessages = ["고객 계좌가 정상 개설되었습니다. (초기 잔액: 10,000원)"];

        // 라디오 버튼 선택에 따라 금액 입력창 숨김/보임 처리
        function toggleInput(show) {
            const amountSection = document.getElementById("amountSection");
            if (show) {
                amountSection.style.display = "block";
            } else {
                amountSection.style.display = "none";
                document.getElementById("amount").value = ""; // 입력창 초기화
            }
        }

        // 트랜잭션 실행 함수
        function processTransaction() {
            const menus = document.getElementsByName("menu");
            let selectedMenu = "";
            
            for (let i = 0; i < menus.length; i++) {
                if (menus[i].checked) {
                    selectedMenu = menus[i].value;
                    break;
                }
            }

            const amountInput = document.getElementById("amount").value.trim();
            const amount = Number(amountInput);
            let currentMessage = "";

            switch (selectedMenu) {
                case "check":
                    currentMessage = `현재 잔액은 ${balance.toLocaleString()}원입니다.`;
                    break;

                case "deposit":
                    // 예외 처리: 숫자가 아니거나 음수일 때
                    if (amountInput === "" || isNaN(amount) || amount <= 0) {
                        currentMessage = "오류: 저금할 금액을 올바른 양의 숫자로 입력해 주세요.";
                    } else {
                        balance += amount;
                        currentMessage = `${amount.toLocaleString()}원이 저금되었습니다. (현재 잔액: ${balance.toLocaleString()}원)`;
                    }
                    break;

                case "withdraw":
                    // 예외 처리: 숫자가 아니거나 음수일 때
                    if (amountInput === "" || isNaN(amount) || amount <= 0) {
                        currentMessage = "오류: 인출할 금액을 올바른 양의 숫자로 입력해 주세요.";
                    } else if (amount > balance) {
                        // 예외 처리: 잔액 부족
                        currentMessage = `오류: 잔액이 부족합니다. (현재 잔액: ${balance.toLocaleString()}원 / 인출 시도: ${amount.toLocaleString()}원)`;
                    } else {
                        balance -= amount;
                        currentMessage = `${amount.toLocaleString()}원이 인출되었습니다. (현재 잔액: ${balance.toLocaleString()}원)`;
                    }
                    break;

                case "interest":
                    let interest = Math.floor(balance * interestRate);
                    balance += interest;
                    currentMessage = `이자가 계산되었습니다. (이율: 2%, 추가 이자: ${interest.toLocaleString()}원, 현재 잔액: ${balance.toLocaleString()}원)`;
                    break;
            }

            // 메시지 배열에 저장 후 조건에 맞게 출력
            logMessages.push(currentMessage);
            updateMessageBox();
        }

        // 메시지 창 업데이트 (최신 메시지가 가장 위에 보이도록 혹은 누적 출력)
        function updateMessageBox() {
            const messageBox = document.getElementById("messageBox");
            // 최근 5개의 기록만 모아서 보여주기 (누적 방식 확장 가능)
            const displayList = logMessages.slice(-5).reverse();
            messageBox.innerText = displayList.join("\n---------------------------\n");
        }
        
        // 초기 실행 화면 세팅
        updateMessageBox();
    </script>
</body>
</html>
