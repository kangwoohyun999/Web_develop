<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>은행 계좌 시뮬레이션</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        .wrap {
            width: 600px;
            border: 1px solid #000;
            padding: 20px;
        }

        h3 {
            margin-top: 0;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        td {
            border: 1px solid #999;
            padding: 10px;
        }

        .menu-area label {
            margin-right: 10px;
        }

        .right {
            text-align: right;
        }

        input[type="text"] {
            width: 100px;
            text-align: right;
            padding: 3px;
        }

        button {
            padding: 3px 15px;
        }
    </style>
</head>

<body>

<div class="wrap">

    <h3>은행 계좌 시뮬레이션</h3>

    <table>

        <tr class="menu-area">
            <td colspan="4">

                <label>
                    <input type="radio" name="menu" value="check" checked>
                    잔액 확인
                </label>

                <label>
                    <input type="radio" name="menu" value="deposit">
                    저금
                </label>

                <label>
                    <input type="radio" name="menu" value="withdraw">
                    인출
                </label>

                <label>
                    <input type="radio" name="menu" value="interest">
                    이자 지급
                </label>

                <button onclick="execute()">실행</button>

            </td>
        </tr>

        <tr>
            <td>저금/인출 금액</td>

            <td>
                <input type="text" id="amount"> 원
            </td>

            <td>잔액</td>

            <td class="right">
                <span id="balanceText">10000</span> 원
            </td>
        </tr>

        <tr>
            <td>이율</td>

            <td>2%</td>

            <td>이자</td>

            <td class="right">
                <span id="interestText"></span> 원
            </td>
        </tr>

        <tr>
            <td>처리 메시지</td>

            <td colspan="3">
                <span id="messageText">
                    10000원 잔액 확인 완료
                </span>
            </td>
        </tr>

    </table>

</div>

<script>

    // 초기 잔액
    let balance = 10000;

    // 이율
    const interestRate = 0.02;

    // 메시지 배열
    const messages = [
        "잔액 확인 완료",
        "저금 완료",
        "인출 완료",
        "이자 지급 완료",
        "저금 금액 오류",
        "인출 금액 오류",
        "인출 불가(잔액 부족)"
    ];

    function execute() {

        // 선택 메뉴
        const menu =
            document.querySelector(
                'input[name="menu"]:checked'
            ).value;

        // 입력 금액
        const amountInput =
            document.getElementById("amount").value;

        // 숫자 변환
        const amount = parseInt(amountInput);

        // 요소 가져오기
        const balElement =
            document.getElementById("balanceText");

        const intElement =
            document.getElementById("interestText");

        const msgElement =
            document.getElementById("messageText");

        // 이자칸 초기화
        intElement.innerText = "";

        switch(menu) {

            // 잔액 확인
            case "check":

                balElement.innerText = balance;

                msgElement.innerText =
                    balance + "원 " + messages[0];

                break;

            // 저금
            case "deposit":

                if (isNaN(amount) || amount < 0) {

                    msgElement.innerText = messages[4];

                } else {

                    balance += amount;

                    balElement.innerText = balance;

                    msgElement.innerText =
                        amount + "원 " + messages[1];
                }

                break;

            // 인출
            case "withdraw":

                if (isNaN(amount) || amount < 0) {

                    msgElement.innerText = messages[5];

                } else if (amount > balance) {

                    msgElement.innerText = messages[6];

                } else {

                    balance -= amount;

                    balElement.innerText = balance;

                    msgElement.innerText =
                        amount + "원 " + messages[2];
                }

                break;

            // 이자 지급
            case "interest":

                let interest =
                    balance * interestRate;

                intElement.innerText = interest;

                balance += interest;

                balElement.innerText = balance;

                msgElement.innerText =
                    interest + "원 " + messages[3];

                break;
        }
    }

</script>

</body>
</html>
