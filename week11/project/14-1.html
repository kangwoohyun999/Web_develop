<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>쇼핑 장바구니 시뮬레이션</title>
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 20px; }
        h3 { border-bottom: 2px solid #000; padding-bottom: 5px; }
        .product-list { margin-bottom: 15px; }
        .product-list label { margin-right: 15px; }
        
        /* 버튼 공통 스타일 및 Hover 효과 (1단계 요구사항) */
        button { padding: 5px 15px; margin-right: 5px; border: 1px solid #ccc; background-color: #eee; }
        button:hover { background-color: blue; color: white; cursor: pointer; }

        .cart-header { display: flex; border-bottom: 1px solid #000; font-weight: bold; margin-top: 20px; padding-bottom: 5px; }
        .col-1 { flex: 1; }
        .col-2 { width: 120px; text-align: right; }
        
        #cartList { list-style-type: none; padding: 0; margin: 10px 0; }
        #cartList li { display: flex; margin-bottom: 5px; }
        
        .total-row { margin-top: 15px; font-weight: bold; }
        .msg-row { margin-top: 10px; color: #333; }
        
        /* 결제 모달 위치 및 스타일 (구매 버튼 아래) */
        .modal {
            display: none; position: absolute; background: white; 
            border: 1px solid #999; padding: 15px; box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
            margin-top: 5px; z-index: 10;
        }
    </style>
</head>
<body>

    <h3>쇼핑 장바구니</h3>

    <div class="product-list">
        <label><input type="checkbox" class="item-chk" value="키보드" data-price="20000"> 키보드 (20,000원)</label>
        <label><input type="checkbox" class="item-chk" value="마우스" data-price="10000"> 마우스 (10,000원)</label>
        <label><input type="checkbox" class="item-chk" value="모니터" data-price="150000"> 모니터 (150,000원)</label>
    </div>

    <div style="position: relative;">
        <button id="btnAdd">추가</button>
        <button id="btnBuy">구매</button>

        <div id="paymentMenu" class="modal">
            <p style="margin-top:0;">결제 수단 선택:</p>
            <label><input type="radio" name="payMethod" value="현금" checked> 현금</label>
            <label><input type="radio" name="payMethod" value="카드"> 카드</label>
            <label><input type="radio" name="payMethod" value="페이"> 페이</label>
            <div style="margin-top: 15px;">
                <button id="btnProceed">구매 진행</button>
                <button id="btnCancel">취소</button>
            </div>
        </div>
    </div>

    <div class="cart-header">
        <div class="col-1">상품명</div>
        <div class="col-2">금액</div>
    </div>
    
    <ul id="cartList"></ul>

    <div class="total-row">
        합계: <input type="text" id="totalPrice" value="0" style="text-align: right; width: 100px;" readonly> 원
    </div>
    <div class="msg-row">
        처리 메시지: <span id="sysMsg"></span>
    </div>

    <script>
        let totalSum = 0;

        // [추가] 버튼 클릭 이벤트
        document.getElementById('btnAdd').addEventListener('click', function() {
            const checks = document.querySelectorAll('.item-chk:checked');
            
            // 유효성 검사
            if (checks.length === 0) {
                alert("상품을 선택한 후 추가 버튼을 클릭하세요.");
                return;
            }

            const cartList = document.getElementById('cartList');

            checks.forEach(function(chk) {
                const itemName = chk.value;
                const itemPrice = parseInt(chk.getAttribute('data-price'));

                // DOM 동적 생성 (<li> 태그 내부에 <span> 2개) - 강의자료 8-10 참조
                const li = document.createElement("li");

                const spanName = document.createElement("span");
                spanName.className = "col-1";
                spanName.innerHTML = itemName;

                const spanPrice = document.createElement("span");
                spanPrice.className = "col-2";
                spanPrice.innerHTML = itemPrice.toLocaleString() + "원";

                li.appendChild(spanName);
                li.appendChild(spanPrice);
                cartList.appendChild(li);

                // 합계 계산
                totalSum += itemPrice;
                
                // 장바구니에 담은 후 체크박스 해제 (선택 사항)
                chk.checked = false; 
            });

            // 합계 및 메시지 갱신
            document.getElementById('totalPrice').value = totalSum.toLocaleString();
            document.getElementById('sysMsg').innerText = "상품이 장바구니에 추가되었습니다.";
        });

        // [구매] 버튼 클릭 이벤트
        document.getElementById('btnBuy').addEventListener('click', function() {
            if (totalSum === 0) {
                alert("상품을 추가한 후 구매 버튼을 클릭하세요.");
                return;
            }
            // 결제 창 나타나기
            document.getElementById('paymentMenu').style.display = "block";
        });

        // [취소] 버튼 클릭 이벤트
        document.getElementById('btnCancel').addEventListener('click', function() {
            // 결제 창 사라지기
            document.getElementById('paymentMenu').style.display = "none";
        });

        // [구매 진행] 버튼 클릭 이벤트
        document.getElementById('btnProceed').addEventListener('click', function() {
            const method = document.querySelector('input[name="payMethod"]:checked').value;
            
            // confirm 창 띄우기
            const isConfirm = confirm("결제 수단을 '" + method + "'(으)로 진행하시겠습니까?");
            
            if (isConfirm) {
                // 결제 완료 처리
                document.getElementById('sysMsg').innerText = "총 " + totalSum.toLocaleString() + "원을 '" + method + "'(으)로 결제 완료했습니다.";
                
                // 장바구니 및 합계 초기화
                document.getElementById('cartList').innerHTML = "";
                totalSum = 0;
                document.getElementById('totalPrice').value = "0";
                
                // 결제 창 사라지기
                document.getElementById('paymentMenu').style.display = "none";
            }
        });
    </script>
</body>
</html>
