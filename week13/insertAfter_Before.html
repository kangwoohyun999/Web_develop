<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>jQuery</title>
<script src="http://code.jquery.com/jquery-3.1.0.js"></script>
<script>
$(document).ready(function() {
$('<p>My</p>').insertAfter('h1'); // h1 요소 뒤에 '<p>My</p>‘ 추가
//$('h1').insertAfter('p'); // h1 요소 뒤로 p 요소를 이동
} );
</script>
</head>
<body>
<h1>Welcome to</h1>
<p>World</p>
</body>
</html>
