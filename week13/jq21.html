<!DOCTYPE html>
<html>
<head>
<title>콤보 박스</title>
<script src="http://code.jquery.com/jquery-3.4.1.js"></script>
</head>
<body>
<div>도시 선택
<select id="mySelect">
<option value="seoul">서울</option>
<option value="pusan">부산</option>
<option value="taegu">대구</option>
</select>
</div>
<div>선택한 도시: <span id="result">seoul, 서울</span></div>
<script>
$(document).ready(function () {
$("#mySelect").on('change', function() {
let vauleSelect = $("#mySelect option:selected").val();
let textSelect = $("#mySelect option:selected").text();
$('#result').text(vauleSelect+', '+textSelect);
});
});
</script></body></html>
