<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>jQuery</title>
<script src="http://code.jquery.com/jquery-3.1.0.js"></script>
<script>
$(document).ready(function() {
$("#append_li").click(function () {
let str = prompt("추가할 이름은?");
if (str!=null)
$("ul").append("<li>"+str+"</li>");
});
});
</script>
</head>
<body>
<input type="button" id="append_li" value="뒤에 추가">
<ul>
<li>Lorem</li>
<li>Ipsum</li>
</ul>
</body>
</html>
