/* mystyle.css */
body { background-color : linen; color : blueviolet;
margin-left : 30px; margin-right : 30px; }
h3 { text-align : center; color : darkred; }

<!DOCTYPE html>
<html>
<head><title>&lt;link&gt; 태그로 스타일 파일 불러오기</title>
<link href="mystyle.css" type="text/css" rel="stylesheet">
</head>
<body>
<h3>소연재</h3>
<hr>
<p>저는 체조 선수 소연재입니다. 음악을 들으면서 책읽기를 좋아
합니다. 김치 찌개와 막국수 무척 좋아합니다.</p>
</body>
</html>

<!-- 

<실습-1> 외부 css 파일 이름을 “mylib.css”로 변경
<실습-2> 외부 css 파일 위치와 이름을 “css/mylib.css”로 변경
<실습-3> 외부 css 파일의 스타일 시트 내용을 html 문서 내부에 <style> 태그로 변경

-->
