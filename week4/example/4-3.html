<!DOCTYPE html>
<html>
<head><title>&lt;style&gt; 태그로 스타일 만들기</title>
<style>
body {
background-color : linen;
color : blueviolet;
margin-left : 30px;
margin-right : 30px;
}
h3 {
text-align : center;
color : darkred;
}
</style>
</head>
<body>
<h3>소연재</h3>
<hr>
<p>저는 체조 선수 소연재입니다. 음악을 들으면서 책읽기를 좋아합
니다. 김치 찌개와 막국수 무척 좋아합니다.</p>
</body>
</html>

<!-- 

<실습-1> <body> 태그의 스타일을 아래와 같이 수정해 보기
→ margin-left, margin-right 값을 20px로 변경, 삭제
<실습-2> <h3> 태그를 새로운 <style> 태그로 분리
<실습-3> <p> 태그의 글씨 크기, 글자색을 변경해 보기

-->
