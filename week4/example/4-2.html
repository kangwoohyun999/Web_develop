<!DOCTYPE html>
<html>
<head><title>스타일을 가진 웹 페이지</title>
<style>
/* CSS 스타일 시트 작성 */
body { background-color : mistyrose; }
h3 { color : purple; }
hr { border : 5px solid yellowgreen; }
span { color : blue; font-size : 20px; }
</style>
</head>
<body>
<h3>CSS 스타일 맛보기</h3>
<hr>
<p>나는 <span>웹 프로그래밍</span>을 좋아합니다.</p>
</body>
</html>

<!-- 

<실습-1> “이번 학기에는 웹개발기초 수업 시간에 HTML와 CSS를 학습하고 있습니다.”
문장을 추가하고, 이 문장 전체를 <p> 태그로 감싸기
<실습-2> “웹개발기초”, “HTML”, “CSS”를 각각 <span> 태그로 감싸기
<실습-3> <span> 태그의 스타일을 글자색은 red로 글자 크기는 25px로 변경
<실습-4> <h3> 태그의 스타일을 글자색은 DeepSkyBlue로 크기는 30px로 변경
