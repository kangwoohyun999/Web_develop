<!DOCTYPE html>
<html>
<head><title>부모 스타일 상속</title></head>
<body>
<h3>부모 스타일 상속</h3>
<hr>
<p style="color:green">자식 태그는 부모의 스타일을
<em style="font-size:25px">상속</em>받는다.
</p>
</body>
</html>

<!-- 

<실습-1> style 속성을 <style> 태그 형식으로 변경
<실습-2> “자식“과 “부모”를 <span> 태그로 지정(감싸기)하고,
<span> 태그의 스타일을 다음과 같이 지정
- 글자색은 blue, 글자 크기는 20px

-->
