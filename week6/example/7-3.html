<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grid Example</title>
<style>
body {
font-family: Arial, sans-serif;
display: flex;
justify-content: center;
align-items: center;
height: 100vh; margin: 0;
}
.grid-container {
display: grid;
grid-template-areas:
'header header header'
'sidebar content content'
'footer footer footer';
grid-template-columns: 1fr 2fr 2fr; /* 너비의 비율 = 1:2:2 */
grid-template-rows: auto; /* 행 높이: 콘텐츠에 맞게 자동 설정 */
gap: 10px; /* 항목들 사이의 간격 */
width: 80%; height: auto;
border: 2px solid #C0C0C0; padding: 10px;
}
.header {
grid-area: header;
background-color: #F0F0F0; padding: 20px;
border: 1px solid #D0D0D0; text-align: center;
}
.sidebar {
grid-area: sidebar;
background-color: #E0E0E0; padding: 20px;
border: 1px solid #D0D0D0; text-align: center;
}
.content {
grid-area: content;
background-color: #D0D0D0; padding: 20px;
border: 1px solid #D0D0D0; text-align: center;
}
.footer {
grid-area: footer;
background-color: #C0C0C0; padding: 20px;
border: 1px solid #D0D0D0; text-align: center;
}
</style></head>
<body>
<div class="grid-container">
<div class="header">Header</div>
<div class="sidebar">Sidebar</div>
<div class="content">Content</div>
<div class="footer">Footer</div>
</div>
</body>
</html>
