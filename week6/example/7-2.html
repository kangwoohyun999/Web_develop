<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grid Example</title>
<style>
body {
font-family: Arial, sans-serif;
display: flex;
justify-content: center;
align-items: center;
height: 100vh; margin: 0;
}
.grid-container {
display: grid;
grid-template-columns: repeat(4, 1fr); /* 4개의 동일한 너비의 열 생성 */
grid-template-rows: repeat(3, 60px); /* 3개의 동일한 높이의 행 생성 */
gap: 10px; /* 항목들 사이의 간격 */
width: 80%; height: auto;
border: 2px solid #C0C0C0;
padding: 10px;
}
.grid-item {
background-color: #F0F0F0;
padding: 20px;
border: 1px solid #D0D0D0;
text-align: center;
}
#item1 {
grid-column: span 2; /* 첫 번째 항목: 두 개의 열 차지 */
grid-row: span 2; /* 첫 번째 항목: 두 개의 행 차지 */
}
#item2 {
grid-column: span 2; /* 두 번째 항목: 두 개의 열 차지 */
}
#item3 {
grid-column: span 2; /* 세 번째 항목: 두 개의 열 차지 */
}
#item4 {
grid-column: span 2; /* 네 번째 항목: 두 개의 열 차지 */
}
#item5 {
grid-row: 3; /* 다섯 번째 항목: 세 번째 행에 위치 */
}
</style></head>
<body>
<div class="grid-container">
<div class="grid-item" id="item1">Item 1</div>
<div class="grid-item" id="item2">Item 2</div>
<div class="grid-item" id="item3">Item 3</div>
<div class="grid-item" id="item4">Item 4</div>
<div class="grid-item" id="item5">Item 5</div>
<div class="grid-item" id="item6">Item 6</div>
</div>
</body>
</html>
