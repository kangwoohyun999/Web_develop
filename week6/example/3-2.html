<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; }
#header, #footer {
width: 500px; margin: 10px;
}
#container {
width: 500px;
border-top: 1px solid #C8C8C8;
border-bottom: 1px solid #C8C8C8;
padding: 10px;
height: 40px;
overflow: hidden;
}
.pull-left {
float: left;
}
.pull-right {
float: right;
}
#logo {
width: 120px;
}
</style></head>
<body>
<div id="header">
<p>Header</p>
</div>
<div id="container">
<div class="pull-left">
<img src="media/kangnam.gif" id="logo">
</div>
<div class="pull-right">
<div class="search-bar">
<form>
<input type="text"/>
<input type="submit" value="검색" />
</form>
</div>
</div>
</div>
<div id="footer">
<p>Footer</p>
</div>
</body>
</html>
