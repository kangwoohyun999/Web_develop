<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flexbox Example</title>
<style>
body {
font-family: Arial, sans-serif;
display: flex;
justify-content: center;
align-items: center;
height: 100vh; margin: 0;
}
.container {
display: flex;
flex-wrap: wrap; /* 항목들이 여러 줄로 배치 가능 */
justify-content: center; /* 항목들을 가로로 가운데 정렬 */
align-content: space-between; /* 수직 항목 사이의 간격을 동일하게 */
width: 80%; height: 300px; border: 2px solid #ccc;
}
.item {
background-color: #f0f0f0;
padding: 20px; border: 1px solid #ddd;
text-align: center;
flex-basis: 30%; /* 각 항목이 차지할 기본 너비 30%로 설정 */
margin: 10px; /* 항목들 사이에 간격을 줌 */
}
</style></head>
<body>
<div class="container">
<div class="item">Item 1</div>
<div class="item">Item 2</div>
<div class="item">Item 3</div>
<div class="item">Item 4</div>
<div class="item">Item 5</div>
<div class="item">Item 6</div>
</div>
</body></html>
