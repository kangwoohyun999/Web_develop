<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원 로그인</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
    <!-- H. [로그인] 클릭 시 새 창에 '회원 로그인' 구현 -->
    <div class="login-container">
        <h2>회원 로그인</h2>
        
        <form>
            <div class="input-group">
                <label for="userid">아이디</label>
                <input type="text" id="userid" placeholder="아이디 입력">
            </div>
            
            <div class="input-group">
                <label for="password">비밀번호</label>
                <input type="password" id="password" placeholder="비밀번호 입력">
            </div>
            
            <!-- 체크박스 -->
            <div class="checkbox-group">
                <input type="checkbox" id="save-id">
                <label for="save-id">아이디 저장</label>
            </div>
            
            <!-- P. [로그인] 버튼 (신청 버튼과 동일한 hover 스타일 적용) -->
            <button type="submit" class="login-submit-btn">로그인</button>
        </form>
        
        <div class="login-links">
            <a href="#">회원가입</a>
            <a href="#">아이디/비밀번호 찾기</a>
        </div>
    </div>
</body>
</html>
