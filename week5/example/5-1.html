<!DOCTYPE html>
<html><head><title>display 프로퍼티</title>
<style>
div {
border : 2px solid yellowgreen;
color : blue;
background : aliceblue;
}
span {
border : 3px dotted red;
background : yellow;
}
</style></head>
<body>
<h3>인라인, 인라인 블록, 블록</h3>
<hr>
나는 <div style=“display:none”>div(none)</div>입니다.<br><br>
나는 <div style=“display:inline”>div(inline)</div>입니다.<br><br>
나는 <div style=“display:inline-block; height:50px">div(inline-block)</div> 입니다.
<br><br>
나는 <div>div<span style="display:block">span(block)</span> 입니다. </div>
</body>
</html>

<!-- 

<실습-1> style 속성으로 만든 스타일 시트를 모두 <style> 태그로 구현
Hint) 하나 하나를 id로 지정
<실습-2> inline-block으로 설정된 태그에 width:200px을 추가하고, block으로 설정된
태그에 width:200px과 height: 50px을 추가

-->
