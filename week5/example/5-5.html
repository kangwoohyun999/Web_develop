<!DOCTYPE html>
<html>
<head><title>float 배치</title>
<style>
#float {

}
</style></head>
<body>
<h3>학기말 공지</h3>
<hr>
<div>
<p id="float">24일은 피아니스트 조성진의 크리
스마스 특별 연주가 있습니다.</p>
<p>이제 곧 겨울 방학이 시작됩니다. 학기 중 못다
한 Java, C++ 프로그래밍 열심히 하기 바랍니다. 인
턴을 준비하는 학생들은 프로젝트 개발에 더욱 힘
쓰세요. 그럼 다음 학기에 만나요.</p>
</div></body></html>
