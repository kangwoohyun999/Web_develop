<!DOCTYPE html>
<html>
<head><title>리스트로 메뉴 만들기</title>
<style>
#menubar {
background : olive;
}
#menubar ul { /* 여백과 패딩 모두 0 */
margin : 0;
padding : 0;
width : 635px; /* 모든 아이템(<li>)을 한 줄에 품을 수 있는 폭 */
}
#menubar ul li {
display : inline-block; /* 새 줄로 넘어가지 않고, 한 줄에 배치 */
list-style-type : none; /* 마커 삭제 */
padding : 5px 15px; /* top=bottom=5, left=right=15px */
}
#menubar ul li a {
color : white;
text-decoration : none; /* 링크 보이지 않게 */
padding : 5px 15px;
}
#menubar ul li a:hover {
background: blue; /* 마우스 올라 갈 때 배경색 */
color: violet;
}
</style>
</head>
<body>
<nav id="menubar">
<ul>
<li><a href="#">Home</a></li>
<li><a href="#">Espresso</a></li>
<li><a href="#">Cappuccino</a></li>
<li><a href="#">Cafe Latte</a></li>
<li><a href="#">F.A.Q</a></li>
</ul>
</nav>
</body>
</html>

<!-- 

<실습-1> nav와 ul 태그의 가로 길이를 140px로 제한해서 메뉴가 세로로
나열되도록 수정
<실습-2> Home을 클릭하면 강남대 홈페이지가 새 탭에 뜨도록 수정
<실습-3> <ul>에 id 추가, <li>에 class를 추가하여 구현
<실습-4> a 태그에 아래 속성 추가
display : inline-block; width: 85px; 

-->
